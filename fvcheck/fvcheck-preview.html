<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FV-CHECK — Prévia (demonstração) · GD Engenharia</title>
<meta name="description" content="Prévia autocontida do FV-CHECK: verificação estrutural expressa para fotovoltaico em telhado.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230e2a47'/><rect x='6' y='13' width='8' height='6' rx='1' fill='%23f5a623'/><rect x='16' y='13' width='8' height='6' rx='1' fill='%23f5a623'/><path d='M4 12 L16 5 L28 12' stroke='white' stroke-width='2.4' fill='none'/></svg>">
<style>
/* ============================================================================
 *  FV-CHECK · GD ENGENHARIA — styles.css
 *  Identidade: azul-marinho profundo + âmbar solar · semáforo técnico.
 *  Tela + impressão do memorial expresso.
 * ========================================================================== */
:root{
  --azul:#0e2a47; --azul2:#1d4f7c; --azul-claro:#e9f1f9;
  --ambar:#f5a623; --ambar-esc:#d18a0f;
  --ok:#1e8449; --ok-bg:#e8f6ee;
  --at:#b9770e; --at-bg:#fdf3e0;
  --fail:#c0392b; --fail-bg:#fdecea;
  --cinza:#5b6470; --cinza-claro:#f4f6f9; --borda:#dfe4ea; --texto:#22282f; --muted:#6b7280;
  --sombra:0 1px 3px rgba(14,42,71,.10),0 1px 2px rgba(14,42,71,.06);
  --sombra2:0 10px 30px rgba(14,42,71,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--cinza-claro);font-size:14.5px;line-height:1.5}
.carregando{padding:40px;text-align:center;color:var(--muted)}
.erro-fatal{margin:40px auto;max-width:620px;padding:24px;background:var(--fail-bg);border:1px solid var(--fail);border-radius:8px;color:#7a1f15}
.muted{color:var(--muted)} .small{font-size:12px} .micro{font-size:11.5px;color:var(--muted)}
.mono{font-family:"Cascadia Code",Consolas,monospace}
.c-ok{color:var(--ok)} .c-at{color:var(--at)} .c-re{color:var(--fail)}
h2.h-sec{color:var(--azul);font-size:17px;margin:26px 0 12px}
h3.sub{margin:16px 0 8px;font-size:14px;color:var(--azul)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borda);background:#fff;color:var(--texto);
  padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;text-decoration:none}
.btn:hover{background:var(--azul-claro);border-color:var(--azul2)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.primary:hover{background:var(--azul2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--fail);border-color:#f0c2bd}
.btn.danger:hover{background:var(--fail-bg)}
.btn.block{display:flex;width:100%;justify-content:center;margin-top:10px}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.grande{padding:13px 26px;font-size:16px;border-radius:10px}
.btn.arquivo{cursor:pointer}
.btn.pulse{border-color:var(--ambar);box-shadow:0 0 0 0 rgba(245,166,35,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.45)}70%{box-shadow:0 0 0 10px rgba(245,166,35,0)}100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}}

/* ---------- Autenticação ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0e2a47 0%,#1d4f7c 55%,#2a6a9e 100%);padding:20px}
.auth-card{background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:34px;width:100%;max-width:430px}
.auth-marca{text-align:center;margin-bottom:18px}
.am-titulo{font-size:26px;font-weight:800;letter-spacing:2.5px;color:var(--azul)}
.am-titulo::after{content:"⚡";color:var(--ambar);margin-left:4px}
.am-sub{font-size:12px;color:var(--muted);margin-top:3px}
.auth-card h2{margin:6px 0 14px;font-size:18px;color:var(--azul)}
.auth-erro{background:var(--fail-bg);color:#7a1f15;border:1px solid var(--fail);padding:9px 12px;border-radius:7px;margin-bottom:12px;font-size:13px}
.auth-rodape{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--borda);padding-top:12px}
.auth-rodape a{color:var(--azul2)}
.rot{display:block;font-size:12.5px;font-weight:600;color:var(--cinza);margin:10px 0 4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.inp:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(29,79,124,.15)}
.inp.mini{width:auto;padding:5px 8px;font-size:12.5px}
.forca-wrap{height:6px;background:#eee;border-radius:4px;overflow:hidden;margin:6px 0}
.forca-bar{height:100%;width:0;transition:.2s}
.forca-bar.s0{background:#ccc}.forca-bar.s1{background:#e74c3c}.forca-bar.s2{background:#e67e22}.forca-bar.s3{background:#f1c40f}.forca-bar.s4{background:#1e8449}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,#0e2a47,#12345a);color:#cfe0f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sb-marca{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-marca b{display:block;color:#fff;font-size:18px;letter-spacing:1px}
.sb-marca b::after{content:"⚡";color:var(--ambar);margin-left:3px}
.sb-marca span{font-size:11px;color:#9bb8d6}
.sb-nav{flex:1;padding:10px 0}
.sb-link{display:flex;align-items:center;gap:11px;padding:11px 18px;color:#cfe0f0;text-decoration:none;font-weight:600;font-size:14px;border-left:3px solid transparent}
.sb-link:hover{background:rgba(255,255,255,.06)}
.sb-link.ativo{background:rgba(255,255,255,.1);border-left-color:var(--ambar);color:#fff}
.sb-link .ico{width:18px;text-align:center;opacity:.9}
.sb-rodape{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12)}
.sb-user b{display:block;color:#fff;font-size:13px}
.sb-user span{font-size:11px;color:#9bb8d6}
.sb-lic{color:#ffd58a;margin:6px 0 10px}
.sb-lic.expirada{color:#ff9d8f;font-weight:700}
.conteudo{flex:1;padding:26px 32px;max-width:1180px;overflow-x:hidden}

/* ---------- Páginas ---------- */
.pg-titulo h1{font-size:23px;margin:0 0 2px;color:var(--azul)}
.pg-titulo{margin-bottom:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.vazio{padding:34px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--borda);border-radius:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--sombra)}
.stat b{display:block;font-size:24px;color:var(--azul)}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.at b{color:var(--at)} .stat.re b{color:var(--fail)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px;box-shadow:var(--sombra)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-top b{font-size:15px}
.card-sub{color:var(--muted);font-size:13px;margin-top:4px}
.card-acoes{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* badges + luzes */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge.mini{padding:2px 8px;font-size:10px}
.badge.sem-ok{background:var(--ok-bg);color:var(--ok)}
.badge.sem-at{background:var(--at-bg);color:var(--at)}
.badge.sem-re{background:var(--fail-bg);color:var(--fail)}
.luzes{display:inline-flex;gap:4px;background:#233240;border-radius:14px;padding:4px 7px;align-items:center}
.lz{width:11px;height:11px;border-radius:50%;background:#46566a;display:inline-block}
.lz.r.on{background:#ff5544;box-shadow:0 0 8px #ff5544}
.lz.a.on{background:#ffb020;box-shadow:0 0 8px #ffb020}
.lz.v.on{background:#31d06c;box-shadow:0 0 8px #31d06c}

/* ---------- Formulários ---------- */
.form-topo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.form-topo .campo{flex:1;min-width:240px}
.form-sec{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--sombra)}
.form-sec h3{margin:0 0 12px;font-size:15px;color:var(--azul);border-bottom:1px solid var(--borda);padding-bottom:8px}
.form-sec h3.sub{border-bottom:none;margin-top:16px;padding-bottom:0}
.grid-campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.campo label.rot{margin-top:0}
.explica{color:var(--cinza);margin:0 0 12px}
.dica{background:#fff9ec;border:1px solid #f3dfad;border-radius:9px;padding:10px 13px;font-size:13px;color:#6b5312;margin:12px 0 4px;line-height:1.55}

/* radio-cards (escolhas ilustradas) */
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px;margin:6px 0}
.radio-card{display:flex;flex-direction:column;gap:3px;border:2px solid var(--borda);border-radius:11px;padding:13px 14px;cursor:pointer;background:#fff;transition:.12s;font-size:13.5px}
.radio-card:hover{border-color:var(--azul2)}
.radio-card.sel{border-color:var(--azul);background:var(--azul-claro);box-shadow:var(--sombra)}
.radio-card input{position:absolute;opacity:0}
.radio-card b{color:var(--azul);font-size:13.5px}
.radio-card span{color:var(--muted);font-size:12px}

/* ---------- Wizard ---------- */
.wiz-barra{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.wiz-et{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:#fff;border:1px solid var(--borda);font-size:12.5px;color:var(--muted);font-weight:600}
.wiz-et i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--borda);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wiz-et.ativa{border-color:var(--azul);color:var(--azul)}
.wiz-et.ativa i{background:var(--azul)}
.wiz-et.feita{color:var(--ok)}
.wiz-et.feita i{background:var(--ok)}
.wiz-tra{flex:0 0 14px;height:2px;background:var(--borda)}

/* ---------- Semáforo hero ---------- */
.sem-hero{display:flex;gap:18px;align-items:center;border-radius:14px;padding:18px 22px;margin:10px 0 16px;color:#fff;box-shadow:var(--sombra2)}
.sem-hero.sem-verde{background:linear-gradient(120deg,#14532d,#1e8449)}
.sem-hero.sem-atencao{background:linear-gradient(120deg,#7c4a03,#b9770e)}
.sem-hero.sem-reprovado{background:linear-gradient(120deg,#7a1f15,#c0392b)}
.sem-hero b{font-size:18px;letter-spacing:.4px}
.sem-hero p{margin:6px 0 0;font-size:13.5px;opacity:.95}
.sem-hero .micro{color:rgba(255,255,255,.88);font-size:12.5px}
.sem-hero .luzes{transform:scale(1.5);margin:0 14px}
.sem-hero.tela .luzes{flex-direction:column;height:auto;padding:8px 6px}

/* ---------- Verificações ---------- */
.verifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.verif-card{background:#fff;border:1px solid var(--borda);border-left:5px solid var(--borda);border-radius:10px;padding:14px 16px;box-shadow:var(--sombra)}
.verif-card.st-verde{border-left-color:var(--ok)}
.verif-card.st-atencao{border-left-color:var(--ambar)}
.verif-card.st-reprovado{border-left-color:var(--fail)}
.vc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vc-top b{font-size:13.5px;color:var(--azul)}
.vc-simples{font-size:13px;color:var(--cinza);margin:6px 0 4px}
.vc-det{font-size:12.5px;color:var(--texto);margin:8px 0 4px;line-height:1.55}
.vc-tec{margin-top:8px}
.vc-tec summary{font-size:12px;color:var(--azul2);cursor:pointer;font-weight:600}
.ratio-wrap{position:relative;height:9px;background:#eef1f5;border-radius:6px;margin:10px 0 4px;overflow:hidden}
.ratio-bar{height:100%;border-radius:6px;background:var(--ok)}
.st-atencao .ratio-bar{background:var(--ambar)}
.st-reprovado .ratio-bar{background:var(--fail)}
.ratio-lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:#22282f;opacity:.55}
.ref{margin-top:6px}

/* ---------- Avisos ---------- */
.avisos-box{margin:14px 0}
.av{padding:9px 13px;border-radius:8px;margin-bottom:6px;font-size:13px}
.av.erro{background:var(--fail-bg);color:#7a1f15}
.av.erro.forte{font-weight:700;border:1px solid var(--fail)}
.av.aviso{background:var(--at-bg);color:#6b4a08;border:1px solid #f3d99a}
.av.info{background:var(--azul-claro);color:#1d4f7c;border:1px solid #c9dcee}

/* ---------- Conferência de medidas ---------- */
.conferir-topo{background:var(--azul-claro);border:1px solid #c9dcee;border-radius:10px;padding:11px 15px;margin-bottom:12px;color:var(--azul);font-size:14px}
.conferir-check{background:#fff9ec;border:1px solid #f3dfad;border-radius:12px;padding:16px 18px}
.conferir-check h3{margin:0 0 10px;color:#6b5312;font-size:15px}
.check-medidas{list-style:none;padding:0;margin:0}
.check-medidas li{padding:6px 0;border-bottom:1px dashed #e6d3a6;font-size:13.5px;color:#5a4a1f;display:flex;justify-content:space-between}
.check-medidas li b{color:var(--azul)}

/* ---------- Figuras ---------- */
.figuras-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:8px}
.figuras-grid .fig,.doc .fig{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px;box-shadow:var(--sombra)}
.figuras-grid .fig svg,.doc .fig svg{display:block;width:100%;height:auto}

/* ---------- Tabelas ---------- */
table.tab{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;background:#fff}
table.tab th{background:var(--azul-claro);color:var(--azul);text-align:left;padding:7px 9px;border:1px solid var(--borda);font-size:12px}
table.tab td{padding:6px 9px;border:1px solid var(--borda);vertical-align:top}
table.tab td.val,table.tab th.val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.tab td.sym{font-weight:700;color:var(--azul);width:70px}
table.tab td.ref{font-size:11px;color:var(--muted);width:30%}
table.tab .fml{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}

/* ---------- Laudo ---------- */
.laudo-painel{background:#fff;border:2px solid var(--ambar);border-radius:12px;padding:18px 20px;margin:12px 0;box-shadow:var(--sombra2)}
.laudo-painel h3{margin:0 0 8px;color:var(--azul)}

/* ---------- Planos ---------- */
.planos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:16px 0}
.plano-card{position:relative;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:22px;box-shadow:var(--sombra);display:flex;flex-direction:column}
.plano-card.destaque{border:2px solid var(--ambar);box-shadow:var(--sombra2)}
.plano-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ambar);color:#fff;font-size:10.5px;font-weight:800;padding:3px 12px;border-radius:12px;letter-spacing:.5px}
.plano-card h3{margin:0 0 6px;color:var(--azul)}
.plano-preco{font-size:30px;font-weight:800;color:var(--azul)}
.plano-preco span{font-size:13px;color:var(--muted);font-weight:600}
.plano-card ul{padding-left:18px;margin:12px 0;color:var(--cinza);font-size:13px;flex:1}
.plano-card li{margin:5px 0}

/* ---------- Normas ---------- */
.norma-det{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.norma-det summary{cursor:pointer;color:var(--azul);font-size:14px}
.norma-det ul{margin:10px 0 4px;padding-left:18px;font-size:13px;color:var(--cinza)}
.norma-det li{margin:5px 0}
.destaque-aviso{background:var(--at-bg);border:1px solid #f3d99a;border-radius:8px;padding:10px 14px;font-size:13px}
ol.lista-limites{padding-left:20px;font-size:13.5px}
ol.lista-limites li{margin:7px 0}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:24px;right:24px;background:var(--azul);color:#fff;padding:12px 18px;border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.3s;z-index:9999;max-width:380px;font-size:13.5px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--ok)} .toast.erro{background:var(--fail)} .toast.info{background:var(--azul2)}

/* ============================ LANDING ================================== */
.landing{background:#fff}
.ld-topo{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;border-bottom:1px solid var(--borda);position:sticky;top:0;background:#fff;z-index:50}
.ld-marca b{font-size:20px;color:var(--azul);letter-spacing:1px}
.ld-marca b::after{content:"⚡";color:var(--ambar)}
.ld-marca span{font-size:11px;color:var(--muted);display:block;margin-top:-3px}
.ld-topo nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ld-topo nav a{color:var(--cinza);text-decoration:none;font-weight:600;font-size:13.5px}
.ld-topo nav a:hover{color:var(--azul)}
.ld-hero{display:flex;gap:40px;align-items:center;padding:60px 5%;background:linear-gradient(135deg,#0e2a47 0%,#1d4f7c 70%,#2a6a9e 100%);color:#fff;flex-wrap:wrap}
.ld-hero-txt{flex:1.3;min-width:300px}
.ld-chip{display:inline-block;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.5);color:#ffd58a;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:16px;letter-spacing:.4px;margin-bottom:14px}
.ld-hero h1{font-size:40px;line-height:1.13;margin:0 0 16px;font-weight:800}
.ld-hero h1 em{color:var(--ambar);font-style:normal}
.ld-hero p{font-size:16px;color:#dbe7f2;max-width:560px}
.ld-cta{display:flex;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.ld-hero .btn.primary{background:var(--ambar);border-color:var(--ambar);color:#20242a}
.ld-hero .btn.primary:hover{background:#ffbe4d}
.ld-hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.ld-hero .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.ld-hero .micro{color:#9bb8d6}
.ld-hero-sem{flex:1;min-width:290px;display:flex;justify-content:center}
.sem-demo{background:#fff;color:var(--texto);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);max-width:340px;width:100%}
.sem-demo>b{color:var(--ok);font-size:15px;display:block;margin:10px 0}
.sd-luzes{display:flex;gap:8px;background:#233240;border-radius:16px;padding:8px 10px;width:max-content}
.sd-luzes .lz{width:16px;height:16px}
.sd-itens{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:13px;color:var(--cinza)}
.sd-itens span{display:flex;justify-content:space-between;border-bottom:1px dashed var(--borda);padding-bottom:4px}
.sd-itens .tv{color:var(--ok)}
.ld-dor{padding:56px 5%;background:var(--cinza-claro)}
.ld-dor h2,.ld-como h2,.ld-planos h2,.ld-faq h2{text-align:center;color:var(--azul);font-size:26px;margin:0 0 30px}
.ld-3col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1080px;margin:0 auto}
.ld-3col>div{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:22px;box-shadow:var(--sombra)}
.ld-3col b{color:var(--azul);font-size:16px}
.ld-3col p{color:var(--cinza);font-size:14px}
.ld-como{padding:56px 5%}
.ld-passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1080px;margin:0 auto}
.passo{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:24px;text-align:center;box-shadow:var(--sombra)}
.passo i{display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--azul);color:#fff;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:16px;margin-bottom:10px}
.passo b{display:block;color:var(--azul);margin-bottom:6px}
.passo p{color:var(--cinza);font-size:13.5px;margin:0}
.ld-planos{padding:56px 5%;background:var(--cinza-claro)}
.ld-planos .planos-grid{max-width:1080px;margin:0 auto}
.ld-laudo-info{text-align:center;color:var(--cinza);margin-top:18px}
.ld-faq{padding:56px 5%;max-width:860px;margin:0 auto}
.ld-faq details{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.ld-faq summary{cursor:pointer;font-weight:700;color:var(--azul);font-size:14.5px}
.ld-faq p{color:var(--cinza);font-size:14px}
.ld-rodape{padding:30px 5%;background:var(--azul);color:#cfe0f0;text-align:center;font-size:13px;line-height:1.8}

/* ============================ MEMORIAL (doc) ============================ */
.doc{background:#fff;color:#222;max-width:820px;margin:0 auto;padding:34px 40px;font-size:13px}
.doc-cab{border-bottom:3px solid var(--azul);padding-bottom:12px;margin-bottom:16px}
.doc-marca b{font-size:20px;color:var(--azul);letter-spacing:1.5px}
.doc-marca b::after{content:"⚡";color:var(--ambar)}
.doc-marca span{font-size:11px;color:var(--muted);margin-left:8px}
.doc h1{font-size:17px;color:var(--azul);margin:10px 0}
.doc h2{font-size:14.5px;color:var(--azul);border-bottom:1px solid var(--borda);padding-bottom:5px;margin:22px 0 10px}
.doc-id th{width:70px}
.doc section{page-break-inside:avoid}
.doc .sem-hero{display:flex}
.sem-hero .sem-luzes{display:flex;flex-direction:column;gap:5px;background:#233240;border-radius:14px;padding:8px 7px;height:max-content}
.sem-hero .luz{width:14px;height:14px;border-radius:50%;background:#46566a}
.sem-hero .luz.r.on{background:#ff5544}.sem-hero .luz.a.on{background:#ffb020}.sem-hero .luz.v.on{background:#31d06c}
.sem-badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10.5px;font-weight:800}
.sem-badge.sem-ok{background:var(--ok-bg);color:var(--ok)}
.sem-badge.sem-at{background:var(--at-bg);color:var(--at)}
.sem-badge.sem-re{background:var(--fail-bg);color:var(--fail)}
.lista-avisos{padding-left:18px}
.lista-avisos li{margin:5px 0}
.lista-avisos .av-erro,.lista-avisos li.av-erro{color:#7a1f15;font-weight:700}
.lista-avisos li.av-atencao{color:#6b4a08}
.cta-laudo{background:var(--azul-claro);border:1px solid #c9dcee;border-radius:10px;padding:4px 16px 10px;margin-top:18px}
.doc-rodape{border-top:2px solid var(--azul);margin-top:24px;padding-top:10px;color:var(--muted);font-size:11px}
.doc-figs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.doc h3.sub-doc{font-size:13px;color:var(--azul);margin:16px 0 4px;font-weight:700}
.tab-verif td{font-size:12px}

/* ---------- Impressão ---------- */
#print-area{display:none}
@media print{
  body{background:#fff}
  body.imprimindo #app,body.imprimindo .toast{display:none !important}
  body.imprimindo #print-area{display:block}
  .doc{max-width:none;padding:0;font-size:11.5px}
  .doc .sem-hero{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc h2{page-break-after:avoid}
  table.tab{page-break-inside:auto}
  tr{page-break-inside:avoid}
}

/* ---------- Responsivo ---------- */
@media (max-width: 880px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sb-nav{display:flex;flex:1;padding:0;flex-wrap:wrap}
  .sb-link{padding:10px 12px;border-left:none;border-bottom:3px solid transparent}
  .sb-link.ativo{border-left:none;border-bottom-color:var(--ambar)}
  .sb-rodape{width:100%;display:flex;gap:14px;align-items:center;justify-content:space-between}
  .conteudo{padding:18px 14px}
  .ld-hero h1{font-size:30px}
}

    if (continuidade === 'continua2') return APOIO.continua2;
    // "3 ou mais": refina pelo nº real de vãos (3 vãos é menos severo que 4+)
    return (nSpans != null && nSpans >= 4) ? APOIO.continua4 : APOIO.continua3;
  }

  /* Fator R — NBR 14762 9.8.2.2 / AISI D6.1.2 (flange conectado à telha por
   * parafusos passantes, flange livre comprimido sob levantamento) */
  function fatorR(tipoPerfil, continuidade, telhaZipada) {
    if (tipoPerfil === 'TR') return { R: 1.0, nota: 'Seção tubular fechada: dispensada a FLT (alta rigidez à torção).' };
    var continua = continuidade !== 'biapoiada';
    var R;
    if (tipoPerfil === 'Z') R = continua ? 0.70 : 0.50;
    else if (tipoPerfil === 'W') R = 0.50; // envoltória conservadora p/ laminado sem contenção do flange inferior
    else R = continua ? 0.60 : 0.40;       // U / Ue
    var nota = 'Fator R = ' + R.toFixed(2) + ' (NBR 14762 9.8.2.2 — flange conectado à telha, levantamento).';
    if (telhaZipada) { R = R * 0.5; nota += ' Telha zipada (clips): fator reduzido à metade — o sistema exige ensaio específico.'; }
    return { R: R, nota: nota };
  }

  function statusPorRatio(r) {
    if (r <= P.SEMAFORO.verde) return 'verde';
    if (r <= P.SEMAFORO.atencao) return 'atencao';
    return 'reprovado';
  }
  var RANK = { verde: 0, atencao: 1, reprovado: 2 };
  function pior(a, b) { return RANK[a] >= RANK[b] ? a : b; }

  /* ---------- resolução do modelo a partir da entrada -------------------- */
  function montarModelo(inp) {
    var avisos = [];

    var aco = inp.acoCustomFy ? { id: 'CUSTOM', nome: 'Aço personalizado', fy: inp.acoCustomFy } : Dados.aco(inp.acoId);
    if (!aco) throw new Error('Aço não encontrado: ' + inp.acoId);
    if (aco.atencao) avisos.push({ tipo: 'atencao', msg: aco.atencao });

    var perfilSpec;
    if (inp.perfilId === 'CUSTOM' || inp.perfilCustom) {
      var pc = inp.perfilCustom || {};
      perfilSpec = { id: 'CUSTOM', type: pc.type, nome: 'Personalizado ' + pc.type + ' ' + pc.bw + '×' + pc.bf + (pc.D ? '×' + pc.D : '') + '×' + pc.t, bw: pc.bw, bf: pc.bf, D: pc.D, t: pc.t };
    } else {
      perfilSpec = Dados.perfil(inp.perfilId);
      if (!perfilSpec) throw new Error('Perfil não encontrado: ' + inp.perfilId);
    }
    var sec = Sections.props(perfilSpec, aco.fy);
    sec.avisos.forEach(function (a) { avisos.push({ tipo: 'info', msg: a }); });

    var telha = Dados.telha(inp.telhaId);
    if (!telha) throw new Error('Telha não encontrada: ' + inp.telhaId);
    if (telha.obs) avisos.push({ tipo: 'info', msg: telha.nome + ': ' + telha.obs });

    var mod = inp.moduloCustom ? inp.moduloCustom : Dados.modulo(inp.moduloId);
    if (!mod || !(mod.comp > 0 && mod.larg > 0 && mod.kg > 0)) throw new Error('Módulo FV inválido');
    var areaMod = mod.comp * mod.larg;
    var trilhos = (inp.trilhos != null) ? inp.trilhos : Dados.TRILHOS_PADRAO;
    var gFv = (mod.kg * 9.81e-3) / areaMod + trilhos; // kN/m² sobre a área com módulos

    var conserv = Dados.porId(Dados.CONSERVACAO, inp.conservacao || 'bom') || Dados.CONSERVACAO[0];
    if (conserv.atencao) avisos.push({ tipo: conserv.reprova ? 'erro' : 'atencao', msg: conserv.atencao });

    var theta = Math.atan((inp.inclinacao || 0) / 100);
    var thetaGraus = theta * 180 / Math.PI;
    var duasAguas = inp.tipoTelhado !== '1agua';
    var zCumeeira = inp.peDireito + (duasAguas ? (inp.largura / 2) : inp.largura) * Math.tan(theta);
    var areaSuperficie = inp.comprimento * inp.largura / Math.cos(theta);
    var areaModulosTotal = (inp.numModulos || 0) * areaMod;
    var cobertura = Math.min(1, areaModulosTotal / areaSuperficie); // fração da área do telhado
    var kwp = (inp.numModulos || 0) * (mod.wp || 0) / 1000;

    var s1 = Dados.porId(Dados.S1_OPCOES, inp.s1 || 'plano') || Dados.S1_OPCOES[0];
    if (s1.atencao) avisos.push({ tipo: 'atencao', msg: s1.atencao });
    var s3 = Dados.porId(Dados.S3_OPCOES, inp.s3 || 'g2') || Dados.S3_OPCOES[0];

    var vento = Vento.calcular({
      v0: inp.v0, s1Valor: s1.valor, s3Valor: s3.valor,
      categoria: inp.categoria || 'II',
      zCumeeira: zCumeeira,
      maiorDimGlobal: Math.max(inp.comprimento, inp.largura, zCumeeira),
      thetaGraus: thetaGraus,
      hRelativo: inp.peDireito / inp.largura,
      permeabilidade: inp.permeabilidade || 'normal'
    });
    vento.avisos.forEach(function (a) { avisos.push({ tipo: 'atencao', msg: a }); });

    // nº de vãos efetivo da terça = nº de pórticos − 1 ≈ comprimento/vão da terça
    var nSpans = Math.max(1, Math.round(inp.comprimento / inp.vaoTerca));
    var apoio = apoioPara(inp.continuidade || 'biapoiada', nSpans);
    var nc = Math.max(0, Math.min(3, Math.round(inp.correntes || 0)));
    var Ly = inp.vaoTerca / (nc + 1);

    return {
      inp: inp, aco: aco, perfil: perfilSpec, sec: sec, telha: telha, mod: mod,
      conserv: conserv, s1: s1, s3: s3, vento: vento, avisos: avisos,
      theta: theta, thetaGraus: thetaGraus, zCumeeira: zCumeeira,
      duasAguas: duasAguas, areaSuperficie: areaSuperficie,
      areaModulosTotal: areaModulosTotal, cobertura: cobertura, kwp: kwp,
      gFv: gFv, trilhos: trilhos, areaMod: areaMod,
      apoio: apoio, nSpans: nSpans, nc: nc, L: inp.vaoTerca, Ly: Ly, s: inp.espacamento,
      pesoTerca: sec.pesoKgM * 9.81e-3 // kN/m
    };
  }

  /* ---------- verificações numéricas para um dado gFv -------------------- */
  function calcularChecks(m, gFv) {
    var sec = m.sec, fy = m.aco.fy, fator = m.conserv.fator;
    var gama = 1.10; // NBR 14762 Tab.5 / NBR 8800 γa1
    var acoes = Acoes.calcular({
      theta: m.theta, s: m.s, gTelha: m.telha.peso, gFv: gFv,
      pesoTerca: m.pesoTerca, dpSuc: m.vento.dpSuc, dpPos: m.vento.dpPos
    });

    var L = m.L, Ly = m.Ly, ap = m.apoio;
    // rigidez pela inércia efetiva (reduzida quando a seção é esbelta) — mais preciso
    var IxServ = sec.IxEf != null ? sec.IxEf : sec.Ix;
    var EIx = P.E * IxServ * 1e-5; // kN·m²

    // Resistências (kN·m, kN)
    var MrdX = sec.WxEf * fy / gama / 1000 * fator;
    var MrdY = sec.WyEf * fy / gama / 1000 * fator;
    var fr = fatorR(sec.tipo, m.inp.continuidade || 'biapoiada', !!m.telha.zipada);
    var MrdXup = fr.R * sec.WxEf * fy / gama / 1000 * fator;
    // Perfil W laminado: o método do fator R não é calibrado para laminados —
    // limita-se adicionalmente ao Mcr elástico (limite inferior sem empenamento):
    // Mcr,LB = (π/L)·√(E·Iy·G·J)  (NBR 8800 Anexo G, a favor da segurança)
    if (sec.laminado) {
      var J = (m.perfil.props && m.perfil.props.J) || 0;
      if (J > 0) {
        var Lmm = m.L * 1000;
        var McrLB = Math.PI / Lmm * Math.sqrt(P.E * sec.Iy * 1e4 * P.G * J * 1e4) / 1e6; // kN·m
        MrdXup = Math.min(MrdXup, McrLB / gama * fator);
        fr.nota += ' Laminado: limitado ao Mcr elástico (limite inferior, sem Cw): ' + McrLB.toFixed(2) + ' kN·m.';
      } else {
        MrdXup = 0.25 * sec.WxEf * fy / gama / 1000 * fator;
        fr.nota += ' Laminado sem J catalogado: envoltória severa 0,25·W·fy.';
      }
    }

    // Cortante (NBR 14762 9.8.3, kv=5; W laminado: 0,6·fy·Aw)
    var hw = sec.hwFlat, tw = sec.t, kv = 5.0;
    var lim1 = 1.08 * Math.sqrt(P.E * kv / fy), lim2 = 1.4 * Math.sqrt(P.E * kv / fy);
    var ht = hw / tw, Vn;
    if (sec.laminado || ht <= lim1) Vn = 0.6 * fy * hw * tw / 1000;
    else if (ht <= lim2) Vn = 0.65 * tw * tw * Math.sqrt(kv * fy * P.E) / 1000;
    else Vn = 0.905 * P.E * kv * Math.pow(tw, 3) / hw / 1000;
    var Vrd = Vn / gama * fator;

    // ---- V1 flexão gravitacional (C1) ----
    var MxC1 = ap.kM * acoes.C1.n * L * L;
    var MyC1 = 0.125 * Math.abs(acoes.C1.t) * Ly * Ly; // subvãos ≈ biapoiados (conservador)
    var rV1 = MxC1 / MrdX + (MrdY > 0 ? MyC1 / MrdY : 0);

    // ---- V2 levantamento (C3) ----
    var rV2 = 0, MxC3 = 0, MyC3 = 0;
    if (acoes.temLevantamento) {
      MxC3 = ap.kM * Math.abs(acoes.C3.n) * L * L;
      MyC3 = 0.125 * Math.abs(acoes.C3.t) * Ly * Ly;
      rV2 = MxC3 / MrdXup + (MrdY > 0 ? MyC3 / MrdY : 0);
    }

    // ---- V2b sobrepressão (C2) — governa só p/ θ alto ----
    var rV2b = 0, MxC2 = 0;
    if (acoes.temSobrepressao) {
      MxC2 = ap.kM * acoes.C2.n * L * L;
      rV2b = MxC2 / MrdX + (MrdY > 0 ? 0.125 * Math.abs(acoes.C2.t) * Ly * Ly / MrdY : 0);
    }

    // ---- V3 cortante ----
    var Vsd = ap.kV * Math.max(acoes.C1.n, Math.abs(acoes.C3.n), acoes.C2.n) * L;
    var rV3 = Vsd / Vrd;

    // ---- V4 flecha (ELS raras) ----
    var dS1 = ap.kD * acoes.S1.n * Math.pow(L, 4) / EIx;               // m
    var dS2 = ap.kD * Math.abs(Math.min(acoes.S2.n, 0)) * Math.pow(L, 4) / EIx;
    var dLim = L / P.FLECHA_TERCA;
    var rV4 = Math.max(dS1, dS2) / dLim;

    // ---- V5 telha ----
    // Capacidade gravitacional corrigida ao vão real: flexão de chapa ∝ 1/L²,
    // porém limitada a 1,5× (em vãos curtos governam esmagamento no apoio e
    // enrugamento, que NÃO crescem ao reduzir o vão).
    var qAdmEf = m.telha.qAdm * Math.min(1.5, Math.pow(m.telha.vaoMax / m.s, 2));
    var rVaoTelha = m.s / m.telha.vaoMax;
    // Gravitacional: manutenção (0,25 kN/m²) + FV somente se apoiado/fixado na telha
    var fvNaTelha = m.inp.fixacao === 'telha';
    var qTelhaGrav = P.SC_COBERTURA * Math.cos(m.theta) + (fvNaTelha ? gFv : 0);
    // Vento: condição preexistente (coplanar fixado na terça não agrava a telha);
    // com fixação na telha, a sucção dos módulos é transferida a ela. Na sucção
    // NÃO há bônus de vão curto: governa o arrancamento/pull-over dos parafusos.
    var qTelhaVento = Math.abs(m.vento.dpSuc);
    var rCargaTelha = qTelhaGrav / qAdmEf;
    // FV fixado NA TELHA: sucção verificada contra o qAdm de catálogo SEM bônus
    // de vão (governa o arrancamento/pull-over dos parafusos, que não escala)
    var rVentoTelha = qTelhaVento / m.telha.qAdm;
    var rV5 = Math.max(rVaoTelha, rCargaTelha, fvNaTelha ? rVentoTelha : 0);
    // Nota informativa (FV nas terças): condição preexistente da telha frente ao
    // vento de norma, com o bônus limitado de flexão do vão real (≤ 1,5×)
    var telhaVentoPreexistente = !fvNaTelha && (qTelhaVento / qAdmEf) > 1;

    return {
      acoes: acoes, gama: gama, fatorConserv: fator, fr: fr,
      MrdX: MrdX, MrdY: MrdY, MrdXup: MrdXup, Vrd: Vrd, Vn: Vn, ht: ht, lim1: lim1, lim2: lim2,
      MxC1: MxC1, MyC1: MyC1, rV1: rV1,
      MxC3: MxC3, MyC3: MyC3, rV2: rV2,
      MxC2: MxC2, rV2b: rV2b,
      Vsd: Vsd, rV3: rV3,
      dS1: dS1, dS2: dS2, dLim: dLim, rV4: rV4,
      rVaoTelha: rVaoTelha, qAdmEf: qAdmEf, qTelhaGrav: qTelhaGrav, qTelhaVento: qTelhaVento,
      rCargaTelha: rCargaTelha, rVentoTelha: rVentoTelha, rV5: rV5,
      telhaVentoPreexistente: telhaVentoPreexistente, fvNaTelha: fvNaTelha,
      EIx: EIx
    };
  }

  /* ---------- reserva de capacidade ---------------------------------------
   * Maior gFv que mantém TODAS as verificações gravitacionais ≤ 1 (inclui a
   * combinação C2 de sobrepressão). Cada razão é máximo de funções afins de
   * gFv (convexa) ⇒ o conjunto viável a partir do ponto atual é um intervalo
   * e a BISSEÇÃO é exata (a extrapolação linear falharia nas quebras). */
  function reservaCapacidade(m) {
    function pior(g) {
      var c = calcularChecks(m, g);
      return Math.max(c.rV1, c.rV2b, c.rV3, c.rV4, c.rCargaTelha);
    }
    if (pior(m.gFv) > 1) return null; // já no limite — sem reserva a declarar
    var lo = m.gFv, hi = m.gFv + 5; // +5 kN/m² ≈ +510 kgf/m² (teto de busca)
    if (pior(hi) <= 1) return { gFvMax: hi, margemKgM2: (hi - m.gFv) * 1000 / 9.81, saturado: true };
    for (var i = 0; i < 40; i++) {
      var mid = (lo + hi) / 2;
      if (pior(mid) <= 1) lo = mid; else hi = mid;
    }
    return {
      gFvMax: lo,
      margemKgM2: (lo - m.gFv) * 1000 / 9.81 // kgf/m² adicionais sobre a área c/ módulos
    };
  }

  /* ---------- verificação completa ---------------------------------------- */
  function verificar(inp) {
    var m = montarModelo(inp);
    var c = calcularChecks(m, m.gFv);
    var c0 = calcularChecks(m, 0); // diagnóstico: estrutura SEM o sistema FV
    var itens = [];

    function item(id, titulo, ratio, ref, detalhe, capMin) {
      var st = statusPorRatio(ratio);
      if (capMin) st = pior(st, capMin);
      itens.push({ id: id, titulo: titulo, ratio: ratio, status: st, ref: ref, detalhe: detalhe });
      return st;
    }

    // V1 — flexão gravitacional
    item('V1', 'Flexão da terça — cargas gravitacionais (C1)', c.rV1,
      'NBR 14762 9.8.2 · NBR 8800 Tab.1',
      'Mx,Sd = ' + c.MxC1.toFixed(2) + ' kN·m ≤ Mx,Rd = ' + c.MrdX.toFixed(2) + ' kN·m · My,Sd = ' + c.MyC1.toFixed(2) + ' ≤ My,Rd = ' + c.MrdY.toFixed(2) + ' kN·m (interação linear)');

    // V2 — levantamento
    if (c.acoes.temLevantamento) {
      item('V2', 'Flexão da terça — levantamento pelo vento (C3)', c.rV2,
        'NBR 14762 9.8.2.2 (fator R) · NBR 6123',
        'Mx,Sd = ' + c.MxC3.toFixed(2) + ' kN·m ≤ Mx,Rd,up = ' + c.MrdXup.toFixed(2) + ' kN·m. ' + c.fr.nota);
    } else {
      item('V2', 'Flexão da terça — levantamento pelo vento (C3)', 0,
        'NBR 6123', 'Sem levantamento líquido: o peso permanente supera a sucção do vento.');
    }

    // V2b — sobrepressão (só quando existe)
    if (c.acoes.temSobrepressao) {
      item('V2b', 'Flexão da terça — sobrepressão de vento (C2)', c.rV2b,
        'NBR 6123 Tabela 5', 'Mx,Sd = ' + c.MxC2.toFixed(2) + ' kN·m ≤ Mx,Rd = ' + c.MrdX.toFixed(2) + ' kN·m');
    }

    // V3 — cortante
    item('V3', 'Cisalhamento da alma da terça', c.rV3,
      'NBR 14762 9.8.3', 'Vsd = ' + c.Vsd.toFixed(2) + ' kN ≤ Vrd = ' + c.Vrd.toFixed(2) + ' kN (h/t = ' + c.ht.toFixed(1) + ')');

    // V4 — flecha
    item('V4', 'Flecha da terça (ELS — L/' + P.FLECHA_TERCA + ')', c.rV4,
      'NBR 8800 Anexo C Tab. C.1',
      'δ = ' + (Math.max(c.dS1, c.dS2) * 1000).toFixed(1) + ' mm ≤ δlim = ' + (c.dLim * 1000).toFixed(1) + ' mm');

    // V5 — telha
    var capTelha = null;
    if (m.telha.naoSuportada) capTelha = 'reprovado';
    else if (m.telha.forcaAtencao || c.telhaVentoPreexistente) capTelha = 'atencao';
    item('V5', 'Telha — vão entre terças e carga', c.rV5,
      'Dados típicos de fabricante (triagem)',
      'Vão: ' + m.s.toFixed(2) + ' m ≤ ' + m.telha.vaoMax.toFixed(2) + ' m · carga gravitacional: ' + c.qTelhaGrav.toFixed(2) + ' ≤ ' + c.qAdmEf.toFixed(2) + ' kN/m² (capacidade corrigida p/ o vão real). A tabela do fabricante prevalece.' +
      (c.telhaVentoPreexistente ? ' NOTA: a sucção de vento de norma (' + c.qTelhaVento.toFixed(2) + ' kN/m²) já supera a capacidade típica da telha — condição PREEXISTENTE, não agravada pelo FV coplanar fixado nas terças, mas que merece avaliação.' : ''), capTelha);

    // V6 — fixação dos módulos (demanda de arrancamento por ponto, zona de borda)
    var nFix = 4;
    var Fborda = Math.abs(m.vento.dpSucLocal) * m.areaMod / nFix;
    var Fcentro = Math.abs(m.vento.dpSuc) * m.areaMod / nFix;
    var stFix = (inp.fixacao === 'telha' && !m.telha.fixDireta) ? 'reprovado'
      : (inp.fixacao === 'telha' || m.telha.zipada) ? 'atencao' : 'verde';
    itens.push({
      id: 'V6', titulo: 'Fixação dos módulos — arrancamento', ratio: null, status: stFix,
      ref: 'NBR 6123 (coef. locais de borda) · ensaio do fabricante',
      detalhe: 'Demanda por ponto (4 fixações/módulo): centro ' + Fcentro.toFixed(2) + ' kN · bordas/cumeeira ' + Fborda.toFixed(2) + ' kN. Exigir do fornecedor resistência de arrancamento ensaiada ≥ estes valores' + (inp.fixacao === 'telha' ? ' — fixação na telha declarada: comprovação por ensaio é OBRIGATÓRIA.' : '.')
    });

    // V7 — acréscimo global sobre a estrutura principal (pórticos/tesouras)
    // Compara o acréscimo de cálculo (1,35·gFv·cobertura) com o caso de
    // dimensionamento GOVERNANTE da cobertura (gravitacional C1 ou sucção C3,
    // com S2/classe da edificação) — prática de avaliação de estruturas
    // existentes (limiar 5%/10%, cf. IEBC 502.4 e literatura de retrofit).
    var gPerm = m.telha.peso + m.pesoTerca / m.s;                       // kN/m² superfície
    var pC1frame = 1.35 * gPerm + 1.5 * P.SC_COBERTURA * Math.cos(m.theta);
    var dpSucGlobal = (m.vento.ceSuc - m.vento.ciPos) * m.vento.qGlobal;
    var pC3frame = Math.abs(1.4 * dpSucGlobal + gPerm * Math.cos(m.theta));
    var pGovernante = Math.max(pC1frame, pC3frame);
    var deltaFv = 1.35 * m.gFv * m.cobertura;
    var acrescimo = deltaFv / pGovernante * 100;
    // ≤5% desprezível · ≤10% verificar (atenção) · >10% REPROVADO expresso
    // (a estrutura principal não é recalculada — acima de 10% não é possível
    // aprovar sem laudo/reforço; coerente com a regra razão>1 ⇒ vermelho)
    var stV7 = acrescimo <= P.ACRESCIMO.verde ? 'verde'
      : (acrescimo <= P.ACRESCIMO.atencao ? 'atencao' : 'reprovado');
    var laudoObrigatorio = acrescimo > P.ACRESCIMO.atencao;
    itens.push({
      id: 'V7', titulo: 'Estrutura principal — acréscimo de carga', ratio: acrescimo / P.ACRESCIMO.atencao, status: stV7,
      ref: 'Prática de avaliação de estruturas existentes (≤ ' + P.ACRESCIMO.verde + '% desprezível · ≤ ' + P.ACRESCIMO.atencao + '% verificar)',
      detalhe: 'Estrutura principal ' + (m.inp.estruturaPrincipal === 'concreto' ? 'de concreto armado/pré-moldado' : 'metálica') + '. Acréscimo de cálculo de ' + acrescimo.toFixed(1) + '% sobre o caso governante do pórtico (' + (pC1frame >= pC3frame ? 'gravitacional' : 'sucção de vento') + ', ' + pGovernante.toFixed(2) + ' kN/m²). Sistema FV: ' + (m.gFv * 1000 / 9.81).toFixed(1) + ' kgf/m² em ' + (m.cobertura * 100).toFixed(0) + '% da área. ' +
        (laudoObrigatorio ? 'Acréscimo RELEVANTE (>' + P.ACRESCIMO.atencao + '%): NÃO instale sem laudo — pórticos/tesouras, ligações, contraventamentos e fundações precisam ser verificados (e, se necessário, reforçados).'
          : acrescimo > P.ACRESCIMO.verde ? 'Acréscimo moderado: recomenda-se a verificação da estrutura principal no laudo assinado.'
            : 'Acréscimo desprezível pela prática de avaliação; a estrutura principal não é recalculada pelo método expresso.'),
      dados: { pC1frame: pC1frame, pC3frame: pC3frame, deltaFv: deltaFv, acrescimo: acrescimo }
    });

  /* ------------------------ Figura 3: pressões de vento ------------------ */
  function figVento(m) {
    var b = m.inp.largura, h = m.inp.peDireito, hc = m.zCumeeira;
    var e = Math.min(300 / b, 130 / hc), X0 = 130, Y0 = 215;
    function P(x, y) { return [X0 + x * e, Y0 - y * e]; }
    var s = '';
    s += linha(20, Y0, 500, Y0, CORES.solo, 2);
    var duas = m.duasAguas;
    var cume = duas ? P(b / 2, hc) : P(b, hc);
    // contorno
    s += poly([P(0, 0), P(b, 0), P(b, h), cume, P(0, h)], '#f4f7fa', CORES.linha, 2);
    // vento incidente
    s += seta(28, P(0, h * 0.7)[1], X0 - 8, P(0, h * 0.7)[1], CORES.vento, 2.2);
    s += txt(30, P(0, h * 0.7)[1] - 10, 'Vento — Vk = ' + m.vento.VkLocal.toFixed(1) + ' m/s · q = ' + m.vento.qLocal.toFixed(2) + ' kN/m²', 10.5, CORES.vento, 'start', ' font-weight="700"');
    // sucções nas águas
    function succoes(p0, p1, ce, lado) {
      var dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.sqrt(dx * dx + dy * dy);
      var nx = dy / len, ny = -dx / len; // normal externa (p/ cima)
      if (ny > 0) { nx = -nx; ny = -ny; }
      var out = '';
      for (var i = 1; i <= 4; i++) {
        var f = i / 5, cx = p0[0] + dx * f, cy = p0[1] + dy * f;
        out += seta(cx, cy, cx + nx * 26, cy + ny * 26, CORES.succao, 1.6);
      }
      out += txt(p0[0] + dx * 0.5 + nx * 44, p0[1] + dy * 0.5 + ny * 44, 'Ce ' + lado + ' = ' + ce.toFixed(2), 10.5, CORES.succao, 'middle', ' font-weight="700"');
      return out;
    }
    s += succoes(P(0, h), cume, m.vento.ce90.EF, 'EF');
    if (duas) s += succoes(cume, P(b, h), m.vento.ce90.GH, 'GH');
    // pressão interna
    var ci = P(b * 0.5, h * 0.45);
    s += seta(ci[0], ci[1], ci[0], ci[1] - 22, CORES.vento, 1.4);
    s += seta(ci[0], ci[1], ci[0] - 22, ci[1], CORES.vento, 1.4);
    s += seta(ci[0], ci[1], ci[0] + 22, ci[1], CORES.vento, 1.4);
    s += txt(ci[0], ci[1] + 16, 'Ci = +' + m.vento.ciPos.toFixed(1), 10.5, CORES.vento);
    // resumo
    s += txt(260, 22, 'Sucção efetiva de projeto no telhado: ΔP = (Ce − Ci)·q = ' + m.vento.dpSuc.toFixed(2) + ' kN/m²', 11.5, CORES.succao, 'middle', ' font-weight="700"');
    s += txt(260, 40, 'NBR 6123: V0=' + m.inp.v0 + ' m/s · S1=' + m.s1.valor.toFixed(2) + ' · S2=' + m.vento.S2Local.toFixed(3) + ' (cat. ' + m.inp.categoria + ', cl. A) · S3=' + m.s3.valor.toFixed(2) + ' · zonas de borda: Ce até ' + m.vento.ceLocalBorda.toFixed(1), 9.5, CORES.muted);
    return svg('0 0 520 250', s, 'Diagrama de pressões de vento (NBR 6123)');
  }

  /* ------------------------ Figura 4: seção do perfil -------------------- */
  function figPerfil(m) {
    var sp = m.perfil, sec = m.sec;
    var s = '', cx = 190, cy = 130;
    function shape() {
      var t;
      if (sec.tipo === 'W') {
        // desenho esquemático de I
        var d = 200, bf = 120; t = 12;
        return poly([[cx - bf / 2, cy - d / 2], [cx + bf / 2, cy - d / 2], [cx + bf / 2, cy - d / 2 + t], [cx + 6, cy - d / 2 + t], [cx + 6, cy + d / 2 - t], [cx + bf / 2, cy + d / 2 - t], [cx + bf / 2, cy + d / 2], [cx - bf / 2, cy + d / 2], [cx - bf / 2, cy + d / 2 - t], [cx - 6, cy + d / 2 - t], [cx - 6, cy - d / 2 + t], [cx - bf / 2, cy - d / 2 + t]], '#dfe7f0', CORES.linha, 1.5);
      }
      var escp = Math.min(200 / sp.bw, 140 / Math.max(sp.bf * (sec.tipo === 'Z' ? 2 : 1), 40));
      var bw = sp.bw * escp, bf = sp.bf * escp, D = (sp.D || 0) * escp;
      t = Math.max(3, sp.t * escp);
      var x0 = sec.tipo === 'Z' ? cx : cx - bf / 2, y0 = cy - bw / 2;
      var out = '';
      function rect(x, y, w, hh) { return poly([[x, y], [x + w, y], [x + w, y + hh], [x, y + hh]], '#dfe7f0', CORES.linha, 1.2); }
      if (sec.tipo === 'TR') {
        out += poly([[cx - bf / 2, y0], [cx + bf / 2, y0], [cx + bf / 2, y0 + bw], [cx - bf / 2, y0 + bw]], '#dfe7f0', CORES.linha, 1.5);
        out += poly([[cx - bf / 2 + t, y0 + t], [cx + bf / 2 - t, y0 + t], [cx + bf / 2 - t, y0 + bw - t], [cx - bf / 2 + t, y0 + bw - t]], '#fff', CORES.linha, 1);
      } else if (sec.tipo === 'Z') {
        out += rect(x0 - t / 2, y0, t, bw);                       // alma
        out += rect(x0 + t / 2, y0, bf - t, t);                   // mesa sup →
        out += rect(x0 + bf - t / 2 - t, y0, t, D);               // enrijecedor sup
        out += rect(x0 - bf + t / 2, y0 + bw - t, bf - t, t);     // mesa inf ←
        out += rect(x0 - bf + t / 2, y0 + bw - D, t, D);          // enrijecedor inf
      } else { // U / UE
        out += rect(x0, y0, t, bw);
        out += rect(x0 + t, y0, bf - t, t);
        out += rect(x0 + t, y0 + bw - t, bf - t, t);
        if (sec.tipo === 'UE') {
          out += rect(x0 + bf - t, y0, t, D);
          out += rect(x0 + bf - t, y0 + bw - D, t, D);
        }
      }
      return out;
    }
    s += shape();
    s += txt(cx, 24, esc(sp.nome) + ' — aço ' + esc(m.aco.nome) + ' (fy = ' + m.aco.fy + ' MPa)', 12, CORES.linha, 'middle', ' font-weight="700"');
    var props = [
      'A = ' + sec.A.toFixed(2) + ' cm²',
      'Ix = ' + sec.Ix.toFixed(0) + ' cm⁴ · Wx = ' + sec.Wx.toFixed(1) + ' cm³',
      'Iy = ' + sec.Iy.toFixed(0) + ' cm⁴ · Wy = ' + sec.Wy.toFixed(1) + ' cm³',
      'peso = ' + sec.pesoKgM.toFixed(2) + ' kg/m',
      sec.rho < 1 ? 'Wx,ef (seção efetiva) = ' + sec.WxEf.toFixed(1) + ' cm³ · ρmín = ' + sec.rho.toFixed(2) : 'seção totalmente efetiva (ρ = 1,0)'
    ];
    props.forEach(function (p, i) { s += txt(330, 84 + i * 20, p, 11, CORES.texto, 'start'); });
    return svg('0 0 520 260', s, 'Seção transversal da terça e propriedades');
  }

  /* ============= CONFERÊNCIA DE MEDIDAS — croqui 2D cotado =============== */

  /* Planta baixa cotada (vista de cima): comprimento, largura, vão entre
   * treliças e espaçamento das terças — para o usuário conferir com o local. */
  function figCroquiPlanta(m) {
    var a = m.inp.comprimento, b = m.inp.largura, theta = m.theta;
    var W = 560, H = 360, mx = 84, myTop = 52, myBot = 78;
    var e = Math.min((W - mx - 96) / a, (H - myTop - myBot) / b);
    var x0 = mx, y0 = myTop, wpx = a * e, hpx = b * e;
    var s = txt(W / 2, 24, 'PLANTA (vista de cima) — confira com o local', 12.5, CORES.linha, 'middle', ' font-weight="700"');
    s += poly([[x0, y0], [x0 + wpx, y0], [x0 + wpx, y0 + hpx], [x0, y0 + hpx]], '#eef3f8', CORES.linha, 1.6);
    if (m.duasAguas) s += linha(x0, y0 + hpx / 2, x0 + wpx, y0 + hpx / 2, CORES.linha, 1.3, ' stroke-dasharray="8,4"') +
      txtHalo(x0 + wpx - 6, y0 + hpx / 2 - 4, 'cumeeira', 9, CORES.muted, 'end');
    // treliças (pórticos) — linhas na direção da largura, a cada vão de terça
    var nS = m.nSpans, dxT = wpx / nS;
    for (var i = 0; i <= nS; i++) {
      var xx = x0 + i * dxT, borda = (i === 0 || i === nS);
      s += linha(xx, y0, xx, y0 + hpx, borda ? CORES.linha : '#9fb2c4', borda ? 1.6 : 1);
    }
    // terças — linhas na direção do comprimento, a cada espaçamento (projetado)
    var espProj = m.s * Math.cos(theta), nT = Math.max(1, Math.round(b / espProj)), dyT = hpx / nT;
    for (var j = 1; j < nT; j++) s += linha(x0, y0 + j * dyT, x0 + wpx, y0 + j * dyT, '#c3d0dd', 0.7, ' stroke-dasharray="5,3"');
    var nPorAgua = m.duasAguas ? Math.max(1, Math.round(nT / 2)) : nT;
    s += txtHalo(x0 + dxT / 2, y0 + 13, 'treliça', 8, CORES.muted) +
      txtHalo(x0 + wpx / 2, y0 + hpx - 6, '≈ ' + nPorAgua + ' terças' + (m.duasAguas ? ' por água' : ''), 8.5, CORES.muted);
    // cotas
    s += dimH(x0, x0 + wpx, y0 + hpx + 50, 'comprimento ' + fmtm(a) + ' m', y0 + hpx, y0 + hpx);
    s += dimH(x0, x0 + dxT, y0 + hpx + 26, 'entre treliças ' + fmtm(m.inp.vaoTerca) + ' m', y0 + hpx, y0 + hpx);
    s += dimV(x0 + wpx + 30, y0, y0 + hpx, 'largura ' + fmtm(b) + ' m', x0 + wpx, x0 + wpx);
    s += dimV(x0 + wpx + 66, y0, y0 + dyT, 'terças @ ' + fmtm(m.s) + ' m', null, null);
    return svg('0 0 ' + W + ' ' + H, s, 'Planta cotada do galpão');
  }

  /* Corte transversal cotado: largura, pé-direito, altura da cumeeira,
   * inclinação e espaçamento das terças na água. */
  function figCroquiCorte(m) {
    var b = m.inp.largura, h = m.inp.peDireito, hc = m.zCumeeira, duas = m.duasAguas;
    var W = 560, H = 340, X0 = 92, Y0 = 250;
    var e = Math.min((W - X0 - 110) / b, (Y0 - 60) / hc);
    function P(x, y) { return [X0 + x * e, Y0 - y * e]; }
    var s = txt(W / 2, 24, 'CORTE (vista de frente) — confira com o local', 12.5, CORES.linha, 'middle', ' font-weight="700"');
    s += linha(30, Y0, W - 20, Y0, CORES.solo, 2);
    var cume = duas ? P(b / 2, hc) : P(b, hc);
    // pilares
    s += poly([[P(0, 0)[0] - 3, P(0, 0)[1]], [P(0, 0)[0] + 3, P(0, 0)[1]], [P(0, h)[0] + 3, P(0, h)[1]], [P(0, h)[0] - 3, P(0, h)[1]]], '#9fb2c4', CORES.linha, 1);
    s += poly([[P(b, 0)[0] - 3, P(b, 0)[1]], [P(b, 0)[0] + 3, P(b, 0)[1]], [P(b, h)[0] + 3, P(b, h)[1]], [P(b, h)[0] - 3, P(b, h)[1]]], '#9fb2c4', CORES.linha, 1);
    // banzos do telhado
    s += linha(P(0, h)[0], P(0, h)[1], cume[0], cume[1], CORES.linha, 3);
    if (duas) s += linha(P(b, h)[0], P(b, h)[1], cume[0], cume[1], CORES.linha, 3);
    // terças (quadradinhos) na água da frente + módulos
    (function () {
      var p0 = P(0, h), dx = cume[0] - p0[0], dy = cume[1] - p0[1], len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len, nx = -uy, ny = ux, st = m.s * e, n = Math.max(2, Math.floor(len / st));
      for (var i = 0; i <= n; i++) { var cx = p0[0] + ux * i * st, cy = p0[1] + uy * i * st; s += poly([[cx - 3, cy - 3], [cx + 3, cy - 3], [cx + 3, cy + 3], [cx - 3, cy + 3]], '#fff', CORES.linha, 1); }
      s += linha(p0[0] + ux * len * 0.12 + nx * 9, p0[1] + uy * len * 0.12 + ny * 9, p0[0] + ux * len * 0.9 + nx * 9, p0[1] + uy * len * 0.9 + ny * 9, CORES.modulo, 4);
      s += txtHalo((p0[0] + cume[0]) / 2 + nx * 22, (p0[1] + cume[1]) / 2 + ny * 22, 'painéis FV', 9, CORES.moduloBorda);
    })();
    // ângulo de inclinação
    var pB = P(0, h);
    s += txtHalo(pB[0] + 42, pB[1] - 8, 'inclinação ' + m.inp.inclinacao + '% (' + fmtm(m.thetaGraus) + '°)', 9.5, CORES.linha, 'start');
    // cotas
    s += dimH(P(0, 0)[0], P(b, 0)[0], Y0 + 30, 'largura ' + fmtm(b) + ' m', P(0, 0)[1], P(b, 0)[1]);
    s += dimV(P(0, 0)[0] - 30, P(0, h)[1], P(0, 0)[1], 'pé-direito ' + fmtm(h) + ' m', P(0, 0)[0], P(0, 0)[0]);
    s += dimV(P(b, 0)[0] + 42, cume[1], P(b, 0)[1], 'cumeeira ' + fmtm(hc) + ' m', cume[0], null);
    return svg('0 0 ' + W + ' ' + H, s, 'Corte transversal cotado');
  }

  /* ============= ISOMÉTRICO 3D COTADO =================================== */
  function figIso3DCotado(m) {
    var a = m.inp.comprimento, b = m.inp.largura, h = m.inp.peDireito, hc = m.zCumeeira;
    var W = 560, H = 400;
    var e = 260 / Math.max(a, b + 6, hc * 2.2);
    var cxp = 250, cyp = 250;
    function P(x, y, z) { return [cxp + (x - z) * 0.866 * e, cyp - y * e + (x + z) * 0.5 * e - (a + b) * 0.25 * e]; }
    var s = txt(W / 2, 22, 'PERSPECTIVA 3D COTADA — confira as três medidas', 12.5, CORES.linha, 'middle', ' font-weight="700"');
    // solo
    s += poly([P(0, 0, 0), P(a, 0, 0), P(a, 0, b), P(0, 0, b)], '#f2f5f8', '#dbe1e8', 1);
    // paredes
    s += poly([P(0, 0, 0), P(a, 0, 0), P(a, h, 0), P(0, h, 0)], CORES.parede, CORES.linha, 1);
    s += poly([P(a, 0, 0), P(a, 0, b), P(a, h, b), P(a, hc, b / 2), P(a, h, 0)], CORES.empena, CORES.linha, 1);
    // águas
    s += poly([P(0, h, b), P(a, h, b), P(a, hc, b / 2), P(0, hc, b / 2)], CORES.telhado2, CORES.linha, 1);
    s += poly([P(0, h, 0), P(a, h, 0), P(a, hc, b / 2), P(0, hc, b / 2)], CORES.telhado, CORES.linha, 1);
    s += linha.apply(null, P(0, hc, b / 2).concat(P(a, hc, b / 2)).concat([CORES.linha, 1.4]));
    // módulos na água da frente
    var nx = Math.min(10, Math.max(3, Math.round(a / 3))), nz = Math.min(4, Math.max(2, Math.round(b / 2 / 1.6)));
    function R(u, v) { return P(u * a, h + v * (hc - h), v * b / 2); }
    for (var i = 0; i < nx; i++) for (var j = 0; j < nz; j++) {
      var u0 = 0.06 + i / nx * 0.9, u1 = u0 + 0.9 / nx - 0.015, v0 = 0.12 + j / nz * 0.78, v1 = v0 + 0.78 / nz - 0.03;
      s += poly([R(u0, v0), R(u1, v0), R(u1, v1), R(u0, v1)], CORES.modulo, CORES.moduloBorda, 0.6);
    }
    // ---- cotas 3D (linhas afastadas, paralelas às arestas) ----
    function dim3(pa, pb, off, rotulo) {
      var A = pa, Bp = pb;
      return linha(A[0], A[1] + off, Bp[0], Bp[1] + off, CORES.cota, 0.8) +
        linha(A[0], A[1], A[0], A[1] + off, CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
        linha(Bp[0], Bp[1], Bp[0], Bp[1] + off, CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
        txtHalo((A[0] + Bp[0]) / 2, (A[1] + Bp[1]) / 2 + off - 4, rotulo, 10);
    }
    // comprimento (aresta da base y=0, z=0): P(0,0,0)→P(a,0,0)
    s += dim3(P(0, 0, 0), P(a, 0, 0), 40, 'comprimento ' + fmtm(a) + ' m');
    // largura (aresta z): P(a,0,0)→P(a,0,b)
    var la = P(a, 0, 0), lb = P(a, 0, b);
    s += linha(la[0], la[1], la[0] + 34, la[1] + 20, CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
      linha(lb[0], lb[1], lb[0] + 34, lb[1] + 20, CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
      linha(la[0] + 34, la[1] + 20, lb[0] + 34, lb[1] + 20, CORES.cota, 0.8) +
      pontaH(la[0] + 34, la[1] + 20, 1) +
      txtHalo((la[0] + lb[0]) / 2 + 46, (la[1] + lb[1]) / 2 + 20, 'largura ' + fmtm(b) + ' m', 10, CORES.cota, 'start');
    // altura (pé-direito) na aresta vertical P(0,0,0)→P(0,h,0)
    var va = P(0, 0, 0), vb = P(0, h, 0);
    s += linha(va[0] - 20, va[1], va[0], va[1], CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
      linha(vb[0] - 20, vb[1], vb[0], vb[1], CORES.cota, 0.4, ' stroke-dasharray="2,2"') +
      linha(va[0] - 20, va[1], vb[0] - 20, vb[1], CORES.cota, 0.8) +
      pontaV(va[0] - 20, va[1], -1) + pontaV(vb[0] - 20, vb[1], 1) +
      '<text x="' + (va[0] - 24) + '" y="' + ((va[1] + vb[1]) / 2) + '" font-size="10" fill="' + CORES.cota + '" text-anchor="middle" transform="rotate(-90 ' + (va[0] - 24) + ' ' + ((va[1] + vb[1]) / 2) + ')" stroke="#fff" stroke-width="3.2" paint-order="stroke">pé-direito ' + fmtm(h) + ' m</text>';
    s += txtHalo(W / 2, H - 10, m.kwp.toFixed(1).replace('.', ',') + ' kWp · ' + m.inp.numModulos + ' painéis · cumeeira a ' + fmtm(hc) + ' m', 10, CORES.muted);
    return svg('0 0 ' + W + ' ' + H, s, 'Perspectiva isométrica cotada');
  }

  /* ============= PLANTA DE MÓDULOS + ZONAS DE BORDA ==================== */
  function figPlantaModulos(m) {
    var a = m.inp.comprimento, b = m.inp.largura;
    var W = 560, H = 330, mx = 60, my = 60;
    var e = Math.min((W - 2 * mx) / a, (H - 2 * my) / b);
    var x0 = mx, y0 = my, wpx = a * e, hpx = b * e;
    var s = txt(W / 2, 24, 'DISTRIBUIÇÃO DOS PAINÉIS E ZONAS DE ALTA SUCÇÃO', 12.5, CORES.linha, 'middle', ' font-weight="700"');
    s += poly([[x0, y0], [x0 + wpx, y0], [x0 + wpx, y0 + hpx], [x0, y0 + hpx]], '#eef3f8', CORES.linha, 1.4);
    // faixa de borda (NBR 6123): largura a0 = min(b/8 ; 0,15·menor lado) — envoltória visual
    var a0 = Math.min(Math.min(a, b) * 0.15, b / 8) * e;
    s += poly([[x0, y0], [x0 + wpx, y0], [x0 + wpx, y0 + a0], [x0, y0 + a0]], 'rgba(192,57,43,.14)', 'none', 0);
    s += poly([[x0, y0 + hpx - a0], [x0 + wpx, y0 + hpx - a0], [x0 + wpx, y0 + hpx], [x0, y0 + hpx]], 'rgba(192,57,43,.14)', 'none', 0);
    s += poly([[x0, y0], [x0 + a0, y0], [x0 + a0, y0 + hpx], [x0, y0 + hpx]], 'rgba(192,57,43,.14)', 'none', 0);
    s += poly([[x0 + wpx - a0, y0], [x0 + wpx, y0], [x0 + wpx, y0 + hpx], [x0 + wpx - a0, y0 + hpx]], 'rgba(192,57,43,.14)', 'none', 0);
    // grade de módulos aproximada a partir da cobertura
    var areaMod = m.areaMod, num = m.inp.numModulos;
    var cols = Math.max(1, Math.round(Math.sqrt(num * a / b))), rows = Math.max(1, Math.ceil(num / cols));
    var gx = wpx * 0.82 / cols, gy = hpx * 0.82 / rows, ox = x0 + wpx * 0.09, oy = y0 + hpx * 0.09, drawn = 0;
    for (var r = 0; r < rows && drawn < num; r++) for (var c = 0; c < cols && drawn < num; c++, drawn++) {
      s += poly([[ox + c * gx + 1, oy + r * gy + 1], [ox + (c + 1) * gx - 1, oy + r * gy + 1], [ox + (c + 1) * gx - 1, oy + (r + 1) * gy - 1], [ox + c * gx + 1, oy + (r + 1) * gy - 1]], CORES.modulo, CORES.moduloBorda, 0.5);
    }
    s += txtHalo(x0 + wpx / 2, y0 + hpx + 22, num + ' painéis · ' + (m.cobertura * 100).toFixed(0) + '% da cobertura · ' + m.kwp.toFixed(1).replace('.', ',') + ' kWp', 10, CORES.muted);

    Auth().criarConta({ nome: 'Demonstração', empresa: 'Integradora Demo', login: 'demo', senha: SENHA })
      .then(pronto)
      .catch(function () { UI().ir('/entrar'); });
  }

  function resumo(R) {
    return {
      semaforo: R.semaforo, kwp: R.modelo.kwp, area: R.modelo.areaSuperficie,
      modulos: R.modelo.inp.numModulos, laudoObrigatorio: R.laudoObrigatorio
    };
  }

  /* ============================ SHELL =================================== */
  function shell(ativo, conteudo) {
    var s = Auth().sessaoAtual, lic = Auth().estadoLicenca();

      ? (lic.trial ? 'Avaliação: ' + lic.diasRestantes + ' dia(s) restante(s)' : 'Plano ' + esc(lic.lic.plano) + ' · ' + lic.diasRestantes + ' dia(s)')
      : 'Licença expirada';
    function link(rota, ico, nome) {
      return '<a class="sb-link' + (ativo === rota ? ' ativo' : '') + '" href="#/' + rota + '"><span class="ico">' + ico + '</span>' + nome + '</a>';
    }
    UI().render(
      '<div class="shell"><aside class="sidebar">' +
      '<div class="sb-marca"><b>FV-CHECK</b><span>fotovoltaico em telhado · GD Engenharia</span></div>' +
      '<nav class="sb-nav">' +
      link('app', '▦', 'Painel') +
      link('nova', '＋', 'Nova verificação') +
      link('laudos', '✓', 'Laudos assinados') +
      link('planos', '◈', 'Planos & Licença') +
      link('conta', '⚙', 'Conta & Segurança') +
      link('normas', '§', 'Normas & Método') +
      '</nav>' +
      '<div class="sb-rodape"><div class="sb-user"><b>' + esc(s.nome) + '</b><span>' + esc(s.login) + ' · ' + (s.papel === 'admin' ? 'administrador' : 'usuário') + '</span></div>' +
      '<div class="sb-lic micro' + (lic.ok ? '' : ' expirada') + '">' + licTxt + '</div>' +
      '<button class="btn mini block" id="btn-sair">Sair</button></div></aside>' +
      '<main class="conteudo">' + conteudo + '</main></div>');
    UI().on('btn-sair', 'click', function () { Auth().sair(); UI().ir('/landing'); });
  }

  /* ============================ PAINEL ================================== */
  function painel() {
    var St = root.FV.Storage;
    var projetos = St.projetos(), laudos = St.laudos();
    var kwp = 0, cont = { verde: 0, atencao: 0, reprovado: 0 };
    projetos.forEach(function (p) {
      if (p.resumo) { kwp += p.resumo.kwp || 0; if (cont[p.resumo.semaforo] != null) cont[p.resumo.semaforo]++; }
    });
    var cards = projetos.map(function (p) {
      var r = p.resumo || {};
      return '<div class="card"><div class="card-top"><b>' + esc(p.entrada.nome) + '</b>' + luzes(r.semaforo) + '</div>' +
        '<div class="card-sub">' + esc(p.entrada.cliente || '—') + ' · ' + esc((p.entrada.cidade || '') + '/' + (p.entrada.uf || '')) + '</div>' +
        '<div class="card-sub">' + (r.kwp ? r.kwp.toFixed(1).replace('.', ',') + ' kWp · ' + r.modulos + ' módulos · ' : '') + badgeSem(r.semaforo, true) + '</div>' +
        '<div class="card-sub micro">Atualizado em ' + UI().dataBr(p.atualizadoEm) + '</div>' +
        '<div class="card-acoes">' +
        '<a class="btn mini primary" href="#/projeto/' + p.id + '">Abrir resultado</a>' +
        '<a class="btn mini" href="#/nova/' + p.id + '">Editar</a>' +
        '<button class="btn mini danger" data-del="' + p.id + '">Excluir</button></div></div>';
    }).join('');

    shell('app',
      '<div class="pg-titulo"><h1>Painel do integrador</h1><div class="muted">Triagem estrutural das suas usinas em telhado</div></div>' +
      '<div class="stats"><div class="stat"><b>' + projetos.length + '</b><span>verificações</span></div>' +
      '<div class="stat"><b>' + kwp.toFixed(0) + '</b><span>kWp analisados</span></div>' +
      '<div class="stat ok"><b>' + cont.verde + '</b><span>verdes</span></div>' +
      '<div class="stat at"><b>' + cont.atencao + '</b><span>atenção</span></div>' +
      '<div class="stat re"><b>' + cont.reprovado + '</b><span>reprovados</span></div>' +
      '<div class="stat"><b>' + laudos.length + '</b><span>laudos solicitados</span></div></div>' +
      '<div class="toolbar"><a class="btn primary" href="#/nova">＋ Nova verificação</a>' +
      '<button class="btn" id="btn-exemplo">Carregar exemplo</button>' +
      '<button class="btn" id="btn-backup">Exportar backup</button>' +
      '<label class="btn arquivo">Importar backup<input type="file" id="inp-importar" accept=".json" hidden></label></div>' +
      (projetos.length ? '<div class="cards">' + cards + '</div>'
        : '<div class="vazio">Nenhuma verificação ainda. Clique em <b>Nova verificação</b> ou em <b>Carregar exemplo</b> para ver o sistema em ação.</div>'));

    document.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (confirm('Excluir esta verificação?')) { St.excluirProjeto(b.getAttribute('data-del')); painel(); }
      });
    });
    UI().on('btn-exemplo', 'click', function () {
      var Val = root.FV.Validate, Eng = root.FV.Engine;
      var v = Val.validar(Dados().EXEMPLO);
      var R = Eng.verificar(v.inp);
      var p = St.salvarProjeto({ entrada: v.inp, resumo: resumo(R) });
      UI().ir('/projeto/' + p.id);
    });
    UI().on('btn-backup', 'click', function () {
      UI().baixar('fvcheck-backup-' + new Date().toISOString().slice(0, 10) + '.json', St.exportarBackup());
      UI().toast('Backup exportado.', 'ok');
    });
    UI().on('inp-importar', 'change', function (ev) {
      var f = ev.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try { var res = St.importarBackup(r.result); UI().toast(res.novosProjetos + ' projeto(s) importado(s).', 'ok'); painel(); }
        catch (e) { UI().toast(e.message, 'erro'); }
      };
      r.readAsText(f);
    });
  }

  /* ============================ WIZARD ================================== */
  var _wiz = { etapa: 1, dados: null };

  function wizard(projetoId) {
    if (!_wiz.dados || _wiz.projetoId !== projetoId || _wiz.finalizado) {
      var base = null;
      if (projetoId) {
        var p = root.FV.Storage.projeto(projetoId);
        if (p) base = JSON.parse(JSON.stringify(p.entrada));
      }
      _wiz = { etapa: 1, projetoId: projetoId || null, finalizado: false, dados: base || { ambiente: 'campo', s1: 'plano', s3: 'g2', fechamento: 'fechado', tipoTelhado: '2aguas', estruturaPrincipal: 'metalica', tercaMaterial: 'aco', continuidade: 'continua3', correntes: 1, conservacao: 'bom', fixacao: 'terca', montagem: 'coplanar', trilhos: Dados().TRILHOS_PADRAO, acoId: 'DESCONHECIDO' } };
    }
    renderEtapa();
  }

  var ETAPAS = ['O projeto', 'Local e vento', 'O galpão', 'Estrutura do telhado', 'A telha', 'Os painéis'];

  function barraEtapas() {
    return '<div class="wiz-barra">' + ETAPAS.map(function (nome, i) {
      var n = i + 1, cls = n < _wiz.etapa ? 'feita' : (n === _wiz.etapa ? 'ativa' : '');
      return '<div class="wiz-et ' + cls + '"><i>' + (n < _wiz.etapa ? '✓' : n) + '</i><span>' + nome + '</span></div>';
    }).join('<div class="wiz-tra"></div>') + '</div>';
  }

  function dica(txt) { return '<div class="dica">💡 ' + txt + '</div>'; }

  function coletarEtapa() {
    var d = _wiz.dados, v = function (id) { return UI().val(id); };
    function radio(nome, atual) {
      var r = document.querySelector('input[name="' + nome + '"]:checked');
      return r ? r.value : atual;
    }
    switch (_wiz.etapa) {
      case 1:
        d.nome = v('w-nome'); d.cliente = v('w-cliente'); d.cidade = v('w-cidade'); d.uf = v('w-uf');
        break;
      case 2:
        d.v0 = v('w-v0'); d.ambiente = radio('w-amb', d.ambiente);
        d.s1 = v('w-s1'); d.fechamento = radio('w-fech', d.fechamento);
        break;
      case 3:
        d.tipoTelhado = radio('w-tipo', d.tipoTelhado); d.largura = v('w-larg'); d.comprimento = v('w-comp');
        d.peDireito = v('w-pd'); d.inclinacao = v('w-incl');
        break;
      case 4:
        d.estruturaPrincipal = radio('w-estr', d.estruturaPrincipal);
        d.tercaMaterial = radio('w-tmat', d.tercaMaterial);
        d.perfilId = v('w-perfil') || d.perfilId;
        if (d.perfilId === 'CUSTOM') d.perfilCustom = { type: v('w-pc-type'), bw: v('w-pc-bw'), bf: v('w-pc-bf'), D: v('w-pc-D'), t: v('w-pc-t') };
        d.acoId = v('w-aco') || d.acoId; d.vaoTerca = v('w-vao'); d.espacamento = v('w-esp');
        d.correntes = v('w-corr'); d.continuidade = v('w-cont'); d.conservacao = v('w-cons');
        break;
      case 5:
        d.telhaId = radio('w-telha', d.telhaId);
        break;
      case 6:
        d.moduloId = v('w-mod');
        if (d.moduloId === 'MCUSTOM') d.moduloCustom = { comp: v('w-mc-comp'), larg: v('w-mc-larg'), kg: v('w-mc-kg'), wp: v('w-mc-wp') };
        d.numModulos = v('w-num'); d.trilhos = v('w-trilhos');
        d.fixacao = radio('w-fix', d.fixacao); d.montagem = radio('w-mont', d.montagem);
        break;
    }
  }

      case 4:

          radioCards('w-tmat', D.TERCA_MATERIAIS, d.tercaMaterial) +
          '<div id="w-terca-aviso" class="av aviso" style="display:' + (tercaAco ? 'none' : 'block') + '">Terças de concreto ou madeira ficam fora da verificação expressa — ao final você poderá solicitar o laudo completo com um engenheiro da rede.</div></div>' +
          '<div class="form-sec" id="w-terca-aco" style="display:' + (tercaAco ? 'block' : 'none') + '"><h3>Sobre as terças de aço</h3>' +
          dica('<b>Como identificar o perfil:</b> olhe a terça de lado (corte). “C” aberto = perfil U · “C” com uma dobrinha virada para dentro na ponta = U enrijecido · formato de “Z” = perfil Z · tubo retangular fechado = metalon. Meça com trena: altura, largura e a espessura da chapa (use um paquímetro ou compare: cartão de crédito ≈ 0,8 mm).') +
          '<div class="grid-campos">' +
          selectC('w-perfil', 'Perfil da terça *', perfis, d.perfilId) +
          selectC('w-aco', 'Tipo de aço (se não souber, deixe “Não sei”)', D.ACOS, d.acoId || 'DESCONHECIDO') +
          campo('w-vao', 'Distância entre as treliças/tesouras (m) *', 'number', d.vaoTerca, 'step="0.1" placeholder="ex.: 5"') +

          dica('<b>Distância entre treliças:</b> meça de um pilar ao próximo, no sentido do comprimento do galpão. <b>Distância entre terças:</b> meça sobre o telhado, de um “ferro” ao outro.') +
          '<div id="w-custom" style="display:' + (d.perfilId === 'CUSTOM' ? 'block' : 'none') + '"><h3 class="sub">Medidas do perfil (mm)</h3><div class="grid-campos">' +
          selectC('w-pc-type', 'Formato', [{ id: 'U', nome: 'U (“C” aberto)' }, { id: 'UE', nome: 'U enrijecido (com dobrinha)' }, { id: 'Z', nome: 'Z enrijecido' }, { id: 'TR', nome: 'Metalon (tubo retangular)' }], custom.type || 'UE') +
          campo('w-pc-bw', 'Altura (mm)', 'number', custom.bw, 'step="1" placeholder="ex.: 150"') +
          campo('w-pc-bf', 'Largura da aba (mm)', 'number', custom.bf, 'step="1" placeholder="ex.: 60"') +
          campo('w-pc-D', 'Dobrinha da ponta (mm)', 'number', custom.D, 'step="1" placeholder="ex.: 20"') +
          campo('w-pc-t', 'Espessura da chapa (mm)', 'number', custom.t, 'step="0.05" placeholder="ex.: 2,65"') +

      case 5:

          return { id: t.id, nome: t.nome, sub: (t.peso * 100).toFixed(0) + ' kgf/m² · vão máx. entre terças ' + t.vaoMax.toFixed(2).replace('.', ',') + ' m' + (t.naoSuportada ? ' · FORA DO ESCOPO' : '') };
        });
        return '<div class="form-sec"><h3>Qual é a telha do galpão?</h3>' + radioCards('w-telha', telhas, d.telhaId) +

      case 6:
        var mc = d.moduloCustom || {};
        return '<div class="form-sec"><h3>Os painéis fotovoltaicos</h3><div class="grid-campos">' +

          campo('w-num', 'Quantidade de painéis *', 'number', d.numModulos, 'step="1" min="1" placeholder="ex.: 96"') +
          campo('w-trilhos', 'Peso de trilhos + fixações (kN/m²)', 'number', d.trilhos, 'step="0.005"') +

          '<div id="w-modcustom" style="display:' + (d.moduloId === 'MCUSTOM' ? 'block' : 'none') + '"><h3 class="sub">Painel personalizado</h3><div class="grid-campos">' +
          campo('w-mc-comp', 'Comprimento (m)', 'number', mc.comp, 'step="0.001"') +

    }
    return '';
