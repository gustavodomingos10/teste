name: Deploy site (GitHub Pages)

# Publica o site estático no GitHub Pages a cada push nas branches listadas.
#   /index.html        → Linha de Vida (completa) · /demo.html (amostra)
#   /fvcheck/          → FV-CHECK (landing/app)   · /fvcheck/demo.html (demonstração)
# Também pode ser disparado manualmente.
on:
  push:
    branches:
      - claude/spreadsheet-software-upgrade-k4c8hf
      - claude/solar-roof-verification-saas-6rstkk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
